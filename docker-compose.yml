services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped

  refresh:
    build: .
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - model-cache:/root/.cache/huggingface
    command: ["python", "scripts/refresh_trials.py", "--max-studies", "1000"]

volumes:
  model-cache:
